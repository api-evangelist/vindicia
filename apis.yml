aid: vindicia
name: Vindicia
description: >-
  Vindicia (an Amdocs company) is a subscription-billing and payment-recovery
  platform for subscription businesses. Its flagship products are Vindicia
  Subscribe, a subscription-management and recurring-billing system, and Vindicia
  Retain, which uses payments intelligence and machine learning trained on
  billions of transactions to recover failed recurring payments and reduce
  involuntary churn. Vindicia Connect adds OAuth2/OpenID Connect identity for
  end-user authentication. The platform exposes REST APIs (Subscribe and Retain),
  a legacy CashBox SOAP API, documented webhooks, API-key and OAuth2
  authentication, a React SDK, error-code references, dated per-product release
  notes, and an Atlassian status page. It integrates with major payment
  processors including Stripe, Adyen, Braintree, PayPal, Chase, CyberSource and
  ACI Worldwide.
